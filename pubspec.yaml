name: streetbrite
description: StreetBite V1.0 — bilingual food discovery and ordering app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7
  get_it: ^8.2.0
  dio: ^5.9.0
  shared_preferences: ^2.5.3
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.0
  google_maps_flutter: ^2.13.1
  image_picker: ^1.2.0
  local_auth: ^2.3.0
  device_info_plus: ^12.1.0
  cached_network_image: ^3.4.1
  intl: any
  uuid: ^4.5.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/
